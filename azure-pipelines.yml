# Local ADO repo trigger ko disable kiya hai
trigger: none

# GitHub repository ko as a resource aur trigger link kiya hai
resources:
  repositories:
    - repository: github-repo
      type: github
      name: deepakbit2-afk/Child-Parent
      endpoint: deepakbit2-afk
      trigger:
        branches:
          include:
            - main
            - feature-storage-backend

pool:
  vmImage: ubuntu-latest

steps:

# 1. Checkout GitHub code
- checkout: github-repo
  displayName: 'Checkout GitHub Code'


# 2. Verify GitHub source
- script: |
    echo "======================================"
    echo "GITHUB SOURCE VERIFICATION"
    echo "======================================"

    echo "Current directory:"
    pwd

    echo ""
    echo "Branch:"
    git branch -a

    echo ""
    echo "Commit:"
    git log -1 --oneline

    echo ""
    echo "Terraform files:"
    find . -type f \( -name "*.tf" -o -name "*.tfvars" \) | sort
  displayName: 'Verify GitHub Source'


# 3. Install Terraform
- script: |
    sudo apt-get update
    sudo apt-get install -y unzip curl

    TERRAFORM_VERSION="1.13.3"

    curl -fsSL "https://hashicorp.com{TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
      -o /tmp/terraform.zip

    unzip -o /tmp/terraform.zip -d /tmp/terraform

    sudo mv /tmp/terraform/terraform /usr/local/bin/terraform

    echo "Terraform version:"
    terraform version
  displayName: 'Install Terraform'


# 4. Terraform Format Check
- script: |
    echo "======================================"
    echo "Terraform Format Check"
    echo "======================================"

    terraform fmt -check -recursive
  displayName: 'Terraform Format Check'


# 5. Terraform Init - Staging
# CI validation only: Azure remote backend is NOT touched
- script: |
    echo "======================================"
    echo "Terraform Init - Staging"
    echo "======================================"

    cd "$(Build.SourcesDirectory)/pipeline/environment/staging"

    echo "Current directory:"
    pwd

    echo ""
    echo "Staging files:"
    ls -la

    echo ""
    echo "Running Terraform Init..."
    terraform init -backend=false
  displayName: 'Terraform Init - Staging'


# 6. Terraform Validate - Staging
- script: |
    echo "======================================"
    echo "Terraform Validate - Staging"
    echo "======================================"

    cd "$(Build.SourcesDirectory)/pipeline/environment/staging"

    echo "Current directory:"
    pwd

    echo ""
    echo "Running Terraform Validate..."
    terraform validate
  displayName: 'Terraform Validate - Staging'
